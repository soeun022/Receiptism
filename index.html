<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt Calculator</title>
  <link rel="icon" type="image/png" href="RECEIPTISM icon.png">
  <link rel="apple-touch-icon" href="RECEIPTISM icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <!-- 引入 Chiron GoRound TC (昭源圓體) 中文字型 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/chiron-goround-tc@latest/index.css">
  <!-- 引入 html2canvas 支援收據截圖匯出 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- 引入 flatpickr 日期選單套件 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    :root,
    [data-theme="rose"] {
      --bg-plane: #e4dede;
      --bg-receipt: #f3ecec;
      --text-main: #5a4b56;
      --text-button: #74616e;
      --btn-bg: #e4d2d7ec;
      --btn-hover: #cab8c0;
      --panel-bg: #faf5f3;
      --panel-border: #ebdada;
      --panel-shadow: rgba(90, 75, 86, 0.15);
      --active-bg: #d4bcc5;
      --active-text: #3f313c;
      --active-shadow: rgba(133, 98, 114, 0.2);
      --selection-bg: #d8c7c9;
      --divider-color: #e4d4d8;
      --receipt-width: 380px;
    }

    [data-theme="sage"] {
      --bg-plane: #e0e0e0;
      --bg-receipt: #edf3ed;
      --text-main: #3e5043;
      --text-button: #4f6355;
      --btn-bg: #d4dbd5ec;
      --btn-hover: #b8c9bb;
      --panel-bg: #f4f8f4;
      --panel-border: #d4dfd6;
      --panel-shadow: rgba(62, 80, 67, 0.15);
      --active-bg: #bcd0c0;
      --active-text: #243528;
      --active-shadow: rgba(80, 110, 85, 0.2);
      --selection-bg: #c5d8c8;
      --divider-color: #d2dfd5;
      --receipt-width: 380px;
    }

    [data-theme="oat"] {
      --bg-plane: #e2dcd6;
      --bg-receipt: #f6f2ec;
      --text-main: #5c4e42;
      --text-button: #746355;
      --btn-bg: #e5dbcfec;
      --btn-hover: #cec2b3;
      --panel-bg: #faf7f2;
      --panel-border: #e6dcd0;
      --panel-shadow: rgba(92, 78, 66, 0.15);
      --active-bg: #d6c6b4;
      --active-text: #3e332a;
      --active-shadow: rgba(120, 100, 80, 0.2);
      --selection-bg: #d9ccbd;
      --divider-color: #e3d8cb;
      --receipt-width: 380px;
    }

    [data-theme="mist"] {
      --bg-plane: #dde0e2;
      --bg-receipt: #edf3f7;
      --text-main: #3c4b57;
      --text-button: #4f606f;
      --btn-bg: #d1dce5ec;
      --btn-hover: #b7c6d4;
      --panel-bg: #f3f7fa;
      --panel-border: #d1dde7;
      --panel-shadow: rgba(60, 75, 87, 0.15);
      --active-bg: #bccedf;
      --active-text: #223342;
      --active-shadow: rgba(75, 105, 130, 0.2);
      --selection-bg: #c5d5e5;
      --divider-color: #d1dce7;
      --receipt-width: 380px;
    }

    [data-theme="lavender"] {
      --bg-plane: #dfdde4;
      --bg-receipt: #f3eff7;
      --text-main: #4e445d;
      --text-button: #635876;
      --btn-bg: #ddd5e9ec;
      --btn-hover: #c7bcd9;
      --panel-bg: #f8f4fb;
      --panel-border: #dfd7ed;
      --panel-shadow: rgba(78, 68, 93, 0.15);
      --active-bg: #c9bbdf;
      --active-text: #322843;
      --active-shadow: rgba(110, 90, 140, 0.2);
      --selection-bg: #d1c3e7;
      --divider-color: #ded6ed;
      --receipt-width: 380px;
    }

    [data-theme="dark"] {
      --bg-plane: #6c6a6e;
      --bg-receipt: #434046;
      --text-main: #e8e2e6;
      --text-button: #cfc7cd;
      --btn-bg: #3a343cec;
      --btn-hover: #6d6570;
      --panel-bg: #2e2a31;
      --panel-border: #4a434d;
      --panel-shadow: rgba(0, 0, 0, 0.35);
      --active-bg: #6d6570;
      --active-text: #ffffff;
      --active-shadow: rgba(0, 0, 0, 0.3);
      --selection-bg: #6d6570;
      --divider-color: #4a424c;
      --receipt-width: 380px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 全域文字反白選取改為主題色 */
    ::selection {
      background-color: var(--selection-bg);
      color: var(--text-main);
    }

    ::-moz-selection {
      background-color: var(--selection-bg);
      color: var(--text-main);
    }

    body {
      position: relative;
      background-color: var(--bg-plane);
      color: var(--text-main);
      font-family: 'Courier Prime', 'Chiron GoRound TC', 'Chiron Hei HK', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 68px 16px 80px;
      user-select: none;
    }

    /* 液態玻璃樣式懸浮選單 DOCK */
    .toolbar {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 26px;
      padding: 20px 28px;
      border-radius: 36px;
      z-index: 10;

      /* 1. 高透光底色 與 2. 135° 對角水珠亮點邊框 (135° Specular Border) */
      border: 1.5px solid transparent;
      background:
        linear-gradient(rgba(247, 237, 235, 0.25), rgba(247, 237, 235, 0.25)) padding-box,
        linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.35) 25%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.35) 75%, rgba(255, 255, 255, 0.85) 100%) border-box;

      /* 跨瀏覽器光學折射濾鏡 */
      -webkit-backdrop-filter: blur(1.5px) saturate(200%) contrast(125%) brightness(90%);
      backdrop-filter: blur(1.5px) saturate(200%) contrast(125%) brightness(90%);

      /* 輕盈柔和外層投影 */
      box-shadow: 0 4px 20px 0 rgba(73, 58, 57, 0.035), 0 1px 4px 0 rgba(0, 0, 0, 0.015);
    }

    /* 3. 無界線羽化漸層反光圈 (Feathered Rim Aura ::after) */
    .toolbar::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 36px;
      box-shadow:
        inset 0 1.5px 6px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1.5px 6px 0 rgba(255, 255, 255, 0.35),
        inset 0 0 8px 1px rgba(255, 255, 255, 0.3);
      filter: blur(1px);
      border: none;
      pointer-events: none;
      z-index: 1;
    }

    /* DOCK 內部的色塊按鈕 (無玻璃效果、無外框) */
    .btn {
      position: relative;
      z-index: 2;
      color: var(--text-button);
      border: none;
      outline: none;
      border-radius: 15px;
      padding: 6px 8px;
      font-size: 11px;
      font-family: 'PT Serif', 'Chiron GoRound TC', serif;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      background-color: var(--btn-bg);
      box-shadow: 0 1px 2px rgba(90, 75, 86, 0.06);
    }

    .btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    .btn:active {
      background-color: var(--btn-hover);
      transform: translateY(0);
      box-shadow: none;
    }

    /* 主要按鈕也是色塊 */
    .btn-primary {
      background-color: var(--btn-bg);
      color: var(--text-button);
      font-weight: 700;
    }

    .btn-primary:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    /* 右上角獨立設定按鈕 (固定在頁面最右上角空白處，不漂浮) */
    .btn-settings-floating {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 90;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background-color: var(--btn-bg);
      color: var(--text-button);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--panel-shadow), 0 1px 3px rgba(0, 0, 0, 0.04);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-settings-floating:hover {
      background-color: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px var(--panel-shadow);
      color: var(--text-main);
    }

    .btn-settings-floating:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px var(--panel-shadow);
    }

    .icon-gear {
      display: block;
      width: 16px;
      height: 16px;
      color: var(--text-button);
      transition: transform 0.35s ease, color 0.2s ease;
    }

    .btn-settings-floating:hover .icon-gear {
      transform: rotate(60deg) scale(1.08);
      color: var(--text-main);
    }

    /* =========================================
       漢堡選單與月份記錄切換下拉面板
       ========================================= */
    .menu-dropdown-container {
      position: relative;
      display: inline-block;
      z-index: 25;
    }

    /* 漢堡按鈕 (尺寸與 DOCK 一致) */
    .btn-menu {
      padding: 10px 14px;
      gap: 0;
      justify-content: center;
      cursor: pointer;
    }

    .icon-hamburger {
      display: block;
      width: 16px;
      height: 14px;
      color: var(--text-button);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .btn-menu:hover .icon-hamburger {
      transform: scale(1.08);
      color: var(--text-main);
    }

    /* 月份下拉面板 */
    .month-dropdown-menu {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: 240px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 14px 32px var(--panel-shadow), 0 3px 8px rgba(0, 0, 0, 0.05);
      padding: 8px 8px 10px;
      display: none;
      flex-direction: column;
      font-family: 'PT Serif', 'Chiron GoRound TC', serif;
      z-index: 100;
      animation: menuFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .month-dropdown-menu.show {
      display: flex;
    }

    @keyframes menuFadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 下拉面板標頭 */
    .dropdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px 8px;
      border-bottom: 1px dashed var(--divider-color);
      margin-bottom: 6px;
    }

    .dropdown-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-button);
      text-transform: uppercase;
    }

    /* 年份導航切換器 */
    .dropdown-year-selector {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--panel-border);
      padding: 2px 5px;
      border-radius: 11px;
    }

    .dropdown-year-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      min-width: 32px;
      text-align: center;
      user-select: none;
    }

    .year-nav-btn {
      background: none;
      border: none;
      color: var(--text-button);
      cursor: pointer;
      font-size: 9px;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, color 0.15s;
    }

    .year-nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.5);
      color: var(--text-main);
    }

    /* 月份列表容器 */
    .month-list {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 2px;
    }

    /* 自訂細緻滾動條 */
    .month-list::-webkit-scrollbar {
      width: 4px;
    }

    .month-list::-webkit-scrollbar-thumb {
      background-color: var(--panel-border);
      border-radius: 4px;
    }

    .month-list::-webkit-scrollbar-track {
      background: transparent;
    }

    /* 單個月份選項 */
    .month-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.15s ease;
      user-select: none;
    }

    .month-item:hover {
      background-color: var(--panel-border);
      transform: translateX(2px);
    }

    /* 當前選中的月份 */
    .month-item.active {
      background-color: var(--active-bg);
      color: var(--active-text);
      font-weight: 700;
      box-shadow: 0 2px 6px var(--active-shadow);
    }

    .month-item-name {
      text-transform: capitalize;
    }

    /* 有儲存資料的提示小標籤 */
    .month-item-badge {
      font-size: 11px;
      opacity: 0.8;
      font-weight: 500;
      color: var(--text-button);
    }

    .month-item.active .month-item-badge {
      opacity: 1;
      font-weight: 700;
      color: var(--active-text);
    }

    /* =========================================
       設定分頁彈窗 (Settings Modal)
       ========================================= */
    .settings-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 28, 33, 0.45);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: modalOverlayFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .settings-modal-overlay.show {
      display: flex;
    }

    @keyframes modalOverlayFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .settings-modal {
      background: var(--panel-bg);
      border: 1.5px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 22px 48px var(--panel-shadow), 0 4px 14px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      padding: 22px 24px;
      position: relative;
      font-family: 'PT Serif', 'Chiron GoRound TC', serif;
      animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--divider-color);
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .btn-close-modal {
      background: none;
      border: none;
      font-size: 16px;
      line-height: 1;
      color: var(--text-button);
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .btn-close-modal:hover {
      background: var(--panel-border);
      color: var(--text-main);
    }

    .settings-section {
      margin-bottom: 20px;
    }

    .settings-section:last-of-type {
      margin-bottom: 6px;
    }

    .settings-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-button);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      display: block;
    }

    .theme-select-wrapper {
      position: relative;
      width: 100%;
    }

    .theme-select {
      width: 100%;
      padding: 10px 32px 10px 14px;
      border-radius: 14px;
      background-color: var(--btn-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: all 0.2s ease;
    }

    .theme-select:hover,
    .theme-select:focus {
      border-color: var(--active-bg);
      background-color: var(--btn-hover);
    }

    .theme-select-arrow {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-button);
      font-size: 10px;
    }

    .settings-btn-group {
      display: flex;
      gap: 10px;
    }

    .settings-action-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background-color: var(--btn-bg);
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .settings-action-btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    .settings-action-btn:active {
      transform: translateY(0);
    }

    .settings-hint {
      font-size: 11px;
      color: var(--text-button);
      opacity: 0.8;
      margin-top: 8px;
      line-height: 1.45;
    }

    .settings-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--active-bg);
      color: var(--active-text);
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      font-family: 'PT Serif', 'Chiron GoRound TC', serif;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
    }

    .settings-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 收據外層容器（柔和立體陰影） */
    .receipt-container {
      position: relative;
      width: 100%;
      max-width: var(--receipt-width);
      filter: drop-shadow(0 14px 24px rgba(73, 58, 57, 0.12)) drop-shadow(0 3px 6px rgba(73, 58, 57, 0.06));
    }

    /* 收據主體 */
    .receipt {
      background-color: var(--bg-receipt);
      width: 100%;
      position: relative;
      padding: 26px 22px;
      /* 模擬紙張質地細微斑駁感 */
      background-image: radial-gradient(rgba(73, 58, 57, 0.03) 1px, transparent 0);
      background-size: 16px 16px;

      /* 上下鋸齒撕紙邊緣 (Zigzag / Perforated effect) */
      --sawtooth-size: 8px;
      clip-path: polygon(
          /* 頂部鋸齒波浪 */
          0% var(--sawtooth-size),
          2% 0, 4% var(--sawtooth-size), 6% 0, 8% var(--sawtooth-size), 10% 0,
          12% var(--sawtooth-size), 14% 0, 16% var(--sawtooth-size), 18% 0, 20% var(--sawtooth-size),
          22% 0, 24% var(--sawtooth-size), 26% 0, 28% var(--sawtooth-size), 30% 0,
          32% var(--sawtooth-size), 34% 0, 36% var(--sawtooth-size), 38% 0, 40% var(--sawtooth-size),
          42% 0, 44% var(--sawtooth-size), 46% 0, 48% var(--sawtooth-size), 50% 0,
          52% var(--sawtooth-size), 54% 0, 56% var(--sawtooth-size), 58% 0, 60% var(--sawtooth-size),
          62% 0, 64% var(--sawtooth-size), 66% 0, 68% var(--sawtooth-size), 70% 0,
          72% var(--sawtooth-size), 74% 0, 76% var(--sawtooth-size), 78% 0, 80% var(--sawtooth-size),
          82% 0, 84% var(--sawtooth-size), 86% 0, 88% var(--sawtooth-size), 90% 0,
          92% var(--sawtooth-size), 94% 0, 96% var(--sawtooth-size), 98% 0, 100% var(--sawtooth-size),
          /* 右邊界 */
          100% calc(100% - var(--sawtooth-size)),
          /* 底部鋸齒波浪 */
          98% 100%, 96% calc(100% - var(--sawtooth-size)), 94% 100%, 92% calc(100% - var(--sawtooth-size)),
          90% 100%, 88% calc(100% - var(--sawtooth-size)), 86% 100%, 84% calc(100% - var(--sawtooth-size)),

    /* 可編輯文字點擊效果 */
    [contenteditable="true"] {
      outline: none;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.2s, background-color 0.2s;
      user-select: text;
    }

    [contenteditable="true"]:hover {
      border-bottom-color: rgba(90, 75, 86, 0.4);
      background-color: rgba(216, 199, 201, 0.25);
    }

    [contenteditable="true"]:focus {
      border-bottom-color: var(--text-main);
      background-color: var(--selection-bg);
    }

    /* 收據頭部 */
    .receipt-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .title-tag {
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .shop-name {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin: 6px 0;
      text-transform: none;
    }

    .shop-info {
      font-size: 11px;
      line-height: 1.5;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    /* 虛線分隔線 */
    .divider {
      border: none;
      border-top: 1px dashed var(--text-main);
      margin: 12px 0;
      opacity: 0.75;
    }

    /* 日期時間列 */
    .receipt-datetime {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 0;
      letter-spacing: 0.5px;
    }

    /* 日期選擇輸入框 (收據內襯線風格) */
    .receipt-date-input {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      width: 110px;
      padding: 1px 4px;
      border-bottom: 1px dashed transparent;
      border-radius: 3px;
      transition: all 0.2s ease;
      outline: none;
    }

    .receipt-date-input:hover {
      border-bottom-color: rgba(90, 75, 86, 0.4);
      background-color: rgba(216, 199, 201, 0.3);
    }

    .receipt-date-input:focus {
      border-bottom-color: var(--text-main);
      background-color: var(--selection-bg);
    }

    /* =========================================
       Flatpickr 淺粉灰色系客製主題 (Custom Soft Pink Theme)
       ========================================= */
    .flatpickr-calendar {
      background: var(--panel-bg) !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 18px !important;
      box-shadow: 0 14px 32px var(--panel-shadow), 0 3px 8px rgba(0, 0, 0, 0.05) !important;
      font-family: 'Courier Prime', 'PT Serif', 'Chiron GoRound TC', sans-serif !important;
      color: var(--text-main) !important;
      padding: 10px 8px !important;
      width: 290px !important;
    }

    /* 氣泡小箭頭顏色配合 */
    .flatpickr-calendar.arrowTop:before,
    .flatpickr-calendar.arrowTop:after {
      border-bottom-color: var(--panel-bg) !important;
    }

    .flatpickr-calendar.arrowBottom:before,
    .flatpickr-calendar.arrowBottom:after {
      border-top-color: var(--panel-bg) !important;
    }

    /* 月份標頭區：彈性置中佈局，左右預留箭頭安全空間 */
    .flatpickr-months {
      position: relative !important;
      background: transparent !important;
      height: 42px !important;
      padding: 0 50px !important;
      border-bottom: 1px dashed var(--divider-color) !important;
      margin-bottom: 8px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box !important;
    }

    .flatpickr-month {
      width: 100% !important;
      height: 100% !important;
      color: var(--text-main) !important;
      fill: var(--text-main) !important;
      position: static !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
    }

    /* 月份年份標題：重設絕對定位與偏位，實現精確正中對齊 */
    .flatpickr-current-month {
      position: static !important;
      left: auto !important;
      right: auto !important;
      top: auto !important;
      bottom: auto !important;
      width: auto !important;
      transform: none !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 6px !important;
      padding: 0 !important;
      margin: 0 auto !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      color: var(--text-main) !important;
      line-height: 1 !important;
      height: auto !important;
    }

    .flatpickr-current-month .cur-month {
      font-weight: 700 !important;
      color: var(--text-main) !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .flatpickr-current-month .numInputWrapper {
      display: inline-flex !important;
      align-items: center !important;
      width: 46px !important;
    }

    .flatpickr-current-month input.cur-year {
      font-weight: 700 !important;
      color: var(--text-main) !important;
      font-family: inherit !important;
      font-size: inherit !important;
      padding: 0 !important;
      margin: 0 !important;
      height: auto !important;
      vertical-align: middle !important;
    }

    /* 月份切換左右箭頭按鈕：垂直絕對居中 (top: 50%)，不爆框不位移 */
    .flatpickr-months .flatpickr-prev-month,
    .flatpickr-months .flatpickr-next-month {
      position: absolute !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      width: 28px !important;
      height: 28px !important;
      padding: 0 !important;
      border-radius: 9px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: var(--text-button) !important;
      fill: var(--text-button) !important;
      transition: all 0.2s ease !important;
      z-index: 5 !important;
    }

    .flatpickr-months .flatpickr-prev-month {
      left: 8px !important;
    }

    .flatpickr-months .flatpickr-next-month {
      right: 8px !important;
    }

    .flatpickr-months .flatpickr-prev-month svg,
    .flatpickr-months .flatpickr-next-month svg {
      width: 13px !important;
      height: 13px !important;
      fill: var(--text-button) !important;
    }

    .flatpickr-months .flatpickr-prev-month:hover,
    .flatpickr-months .flatpickr-next-month:hover {
      background: var(--panel-border) !important;
      color: var(--text-main) !important;
      fill: var(--text-main) !important;
    }

    /* 星期標籤 (週一到週日) */
    span.flatpickr-weekday {
      color: var(--text-button) !important;
      font-weight: 700 !important;
      font-size: 80% !important;
    }

    /* 日曆日期格 */
    .flatpickr-day {
      color: var(--text-main) !important;
      border-radius: 10px !important;
      border: 1px solid transparent !important;
      font-weight: 500 !important;
      height: 34px !important;
      line-height: 34px !important;
      margin: 2px !important;
      transition: all 0.15s ease !important;
    }

    .flatpickr-day:hover {
      background: var(--panel-border) !important;
      border-color: var(--panel-border) !important;
      color: var(--text-main) !important;
    }

    /* 今日標記 */
    .flatpickr-day.today {
      border: 1.5px dashed var(--active-bg) !important;
      background: rgba(235, 218, 218, 0.2) !important;
      color: var(--text-main) !important;
    }

    /* 選取日期 (淺粉灰塊) */
    .flatpickr-day.selected,
    .flatpickr-day.startRange,
    .flatpickr-day.endRange {
      background: var(--active-bg) !important;
      border-color: var(--active-bg) !important;
      color: var(--active-text) !important;
      font-weight: 700 !important;
      box-shadow: 0 2px 6px var(--active-shadow) !important;
    }

    .flatpickr-day.selected:hover {
      background: var(--active-bg) !important;
      border-color: var(--active-bg) !important;
    }

    /* 非當月日期 (淡化) */
    .flatpickr-day.prevMonthDay,
    .flatpickr-day.nextMonthDay {
      color: #baa8b0 !important;
      opacity: 0.65 !important;
    }

    /* 明細表頭 (品項 | 數量 | 單價金額) */
    .receipt-table-header {
      display: grid;
      grid-template-columns: 1fr 48px 70px 24px;
      font-size: 13px;
      font-weight: 700;
      padding-bottom: 5px;
      border-bottom: 1px dashed var(--text-main);
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .col-item {
      text-align: left;
      padding-left: 2px;
    }

    .col-qty {
      text-align: center;
    }

    .col-amt {
      text-align: right;
    }

    .col-action {
      text-align: center;
    }

    /* 明細列表項目 */
    .items-list {
      margin: 8px 0 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 1fr 48px 70px 24px;
      align-items: center;
      font-size: 13px;
      min-height: 24px;
    }

    .item-row input {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      padding: 2px 4px;
      outline: none;
      width: 100%;
    }

    .item-row input:focus {
      background-color: var(--selection-bg);
      border-bottom: 1px dashed var(--text-main);
      border-radius: 2px;
    }

    .item-row input.input-item {
      text-align: left;
    }

    .item-row input.input-qty {
      text-align: center;
    }

    .item-row input.input-amt {
      text-align: right;
    }

    /* 刪除品項按鈕 */
    .btn-delete {
      background: none;
      border: none;
      color: var(--text-button);
      opacity: 0.5;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, opacity 0.15s;
    }

    .btn-delete:hover {
      color: #b34a4a;
      opacity: 1;
    }

    /* 行內新增按鈕 */
    .add-row-zone {
      text-align: center;
      margin: 6px 0 10px;
    }

    .btn-inline-add {
      background: none;
      border: 1px dashed var(--text-button);
      border-radius: 4px;
      color: var(--text-main);
      opacity: 0.75;
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-inline-add:hover {
      border-color: var(--text-main);
      background-color: var(--btn-bg);
      opacity: 1;
      color: var(--text-main);
    }

    /* 結算合計區塊 */
    .receipt-summary {
      margin-top: 6px;
      border-top: 1px dashed var(--text-main);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .summary-row.total-row {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .summary-row input {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      text-align: right;
      width: 110px;
      outline: none;
    }

    .summary-row input:focus {
      background-color: var(--selection-bg);
      border-bottom: 1px dashed var(--text-main);
      border-radius: 2px;
    }

    .summary-val {
      font-weight: 700;
    }

    /* 收據頁尾 */
    .receipt-footer {
      text-align: center;
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* 列印與純淨匯出樣式 */
    @media print {
      body {
        background: #fff !important;
        padding: 0;
      }

      .toolbar,
      .btn-settings-floating,
      .btn-delete,
      .add-row-zone {
        display: none !important;
      }

      .receipt-container {
        filter: none;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- 右上角獨立設定按鈕 (DOCK 外部) -->
  <button class="btn-settings-floating" id="settingsBtn" onclick="openSettingsModal()" title="Settings / 設定"
    aria-label="Settings">
    <svg class="icon-gear" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
      </path>
    </svg>
  </button>

  <!-- 工具列 -->
  <div class="toolbar">
    <!-- 漢堡選單：切換每個月的紀錄 -->
    <div class="menu-dropdown-container">
      <button class="btn btn-menu" id="hamburgerBtn" onclick="toggleMonthMenu(event)" title="Monthly Records"
        aria-label="Monthly Records">
        <svg class="icon-hamburger" width="16" height="14" viewBox="0 0 16 14" fill="currentColor">
          <rect y="0" width="16" height="2.2" rx="1.1"></rect>
          <rect y="5.9" width="16" height="2.2" rx="1.1"></rect>
          <rect y="11.8" width="16" height="2.2" rx="1.1"></rect>
        </svg>
      </button>

      <!-- 下拉月份選單面板 -->
      <div class="month-dropdown-menu" id="monthDropdownMenu">
        <div class="dropdown-header">
          <span class="dropdown-title">Monthly Records</span>
          <div class="dropdown-year-selector">
            <button type="button" class="year-nav-btn" onclick="changeYear(-1, event)" title="Previous Year">◀</button>
            <span class="dropdown-year-badge" id="dropdownYearBadge">2026</span>
            <button type="button" class="year-nav-btn" onclick="changeYear(1, event)" title="Next Year">▶</button>
          </div>
        </div>
        <div class="month-list" id="monthList">
          <!-- JS 動態生成月份項目 -->
        </div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="addNewItem()">+ Add Item</button>
    <button class="btn" onclick="clearAllItems()">Clear All</button>
    <button class="btn" onclick="exportReceiptImage()">Export Image</button>
  </div>

  <!-- 設定分頁彈窗 (Settings Modal) -->
  <div class="settings-modal-overlay" id="settingsModalOverlay" onclick="closeSettingsModalOnOverlay(event)">
    <div class="settings-modal" id="settingsModal">
      <div class="modal-header">
        <div class="modal-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          Settings
        </div>
        <button type="button" class="btn-close-modal" onclick="closeSettingsModal()" title="Close">✕</button>
      </div>

      <!-- 區塊 1：外觀主題切換選單 -->
      <div class="settings-section">
        <label class="settings-section-title" for="themeSelect">Theme</label>
        <div class="theme-select-wrapper">
          <select id="themeSelect" class="theme-select" onchange="onThemeChange(this.value)">
            <option value="rose">經典粉灰 (Classic Rose)</option>
            <option value="sage">鼠尾草綠 (Sage Green)</option>
            <option value="oat">燕麥奶茶 (Oat Milk)</option>
            <option value="mist">沉靜霧藍 (Mist Blue)</option>
            <option value="lavender">柔霧薰衣草 (Lavender)</option>
            <option value="dark">曜石墨黑 (Midnight Noir)</option>
          </select>
          <span class="theme-select-arrow">▼</span>
        </div>
        <div class="settings-hint">自訂您喜愛的收據色彩風格，切換後自動保存。</div>
      </div>

      <!-- 區塊 2：資料備份與匯出匯入 -->
      <div class="settings-section">
        <span class="settings-section-title">Data Backup</span>
        <div class="settings-btn-group">
          <button type="button" class="settings-action-btn" onclick="exportAllData()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            匯出資料
          </button>
          <button type="button" class="settings-action-btn" onclick="triggerImportFileInput()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            匯入資料
          </button>
        </div>
        <!-- 隱藏的檔案上傳輸入框 -->
        <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;"
          onchange="handleFileImport(event)" />
        <div class="settings-hint">可將所有歷史記帳資料安全備份為 JSON 檔案，或隨時還原備份資料。</div>
      </div>
    </div>
  </div>

  <!-- 提示浮動 Toast -->
  <div class="settings-toast" id="settingsToast"></div>

  <!-- 收據主體容器 -->
  <div class="receipt-container" id="receiptContainer">
    <div class="receipt" id="receipt">

      <!-- 抬頭與店名資訊 (包含 strawberry 圖示) -->
      <div class="receipt-header">
        <div class="title-tag" contenteditable="true" spellcheck="false">Receiptism</div>
        <div class="shop-name" contenteditable="true" spellcheck="false">september</div>
        <div class="shop-info" contenteditable="true" spellcheck="false">
          Address: Lorem Ipsum, 1234-5<br>
          Tel: +1 012 345 67 89
        </div>
      </div>

      <hr class="divider">

      <!-- 日期與時間 -->
      <div class="receipt-datetime">
        <input type="text" id="receiptDate" class="receipt-date-input" readonly spellcheck="false" value="11/12/2026"
          placeholder="MM/DD/YYYY" title="點擊選擇日期" />
        <span id="receiptTime" contenteditable="true" spellcheck="false">11:13:06 AM</span>
      </div>

      <hr class="divider">

      <!-- 明細表頭 (品項 | 數量 | 金額) -->
      <div class="receipt-table-header">
        <span class="col-item">ITEM</span>
        <span class="col-qty">QTY</span>
        <span class="col-amt">AMT</span>
        <span class="col-action"></span>
      </div>

      <!-- 明細列表 -->
      <div class="items-list" id="itemsList">
        <!-- JS 動態渲染品項 -->
      </div>

      <!-- 快速加行 -->
      <div class="add-row-zone">
        <button class="btn-inline-add" onclick="addNewItem()">+ Add New Row</button>
      </div>

      <!-- 總額、實收與找零 (無小數點) -->
      <div class="receipt-summary">
        <div class="summary-row total-row">
          <span>Total</span>
          <span class="summary-val" id="totalAmount">0</span>
        </div>
        <div class="summary-row">
          <span>Cash</span>
          <input type="number" id="cashInput" step="1" placeholder="0" oninput="calculateTotal(); saveToStorage();" />
        </div>
        <div class="summary-row">
          <span>Change</span>
          <span class="summary-val" id="changeAmount">0</span>
        </div>
      </div>

      <hr class="divider">

      <!-- 結尾致謝詞 -->
      <div class="receipt-footer" contenteditable="true" spellcheck="false">
        THANK YOU!
      </div>

    </div>
  </div>

  <script>
    // 預設示範資料 (純整數無小數點，經典英文品項)
    const defaultData = [
      { qty: 1, item: "Americano", unitPrice: 65, amt: 65 },
      { qty: 2, item: "Croissant", unitPrice: 45, amt: 90 },
      { qty: 1, item: "Cafe Latte", unitPrice: 85, amt: 85 },
      { qty: 1, item: "Espresso", unitPrice: 50, amt: 50 },
      { qty: 2, item: "Handmade Cookie", unitPrice: 35, amt: 70 },
      { qty: 1, item: "Caramel Macchiato", unitPrice: 95, amt: 95 },
      { qty: 2, item: "Chocolate Scone", unitPrice: 40, amt: 80 },
      { qty: 1, item: "Cinnamon Roll", unitPrice: 80, amt: 80 }
    ];

    let items = JSON.parse(JSON.stringify(defaultData));

    // 當前選取年份與月份 (0 ~ 11)
    let currentSelectedYear = new Date().getFullYear();
    let currentSelectedMonth = new Date().getMonth();

    // 依年份與月份產生專屬 Storage Key
    function getMonthStorageKey(year, month) {
      const mm = String(month + 1).padStart(2, '0');
      return `strawbreceipt_${year}-${mm}`;
    }

    // 儲存至 localStorage (依當前年份與月份儲存)
    function saveToStorage() {
      try {
        const key = getMonthStorageKey(currentSelectedYear, currentSelectedMonth);
        const cashInput = document.getElementById("cashInput");
        const cashVal = cashInput ? cashInput.value : "0";
        const record = {
          items: items,
          cash: cashVal,
          updatedAt: new Date().toISOString()
        };
        localStorage.setItem(key, JSON.stringify(record));
        localStorage.setItem("strawbreceipt_last_selected", `${currentSelectedYear}-${currentSelectedMonth}`);
        if (typeof renderMonthList === 'function') {
          renderMonthList();
        }
      } catch (err) {
        console.warn("無法儲存至 localStorage:", err);
      }
    }

    // 清除當前所選月份的 localStorage 紀錄
    function clearStorage() {
      try {
        const key = getMonthStorageKey(currentSelectedYear, currentSelectedMonth);
        localStorage.removeItem(key);
        if (typeof renderMonthList === 'function') {
          renderMonthList();
        }
      } catch (err) {
        console.warn("無法清除 localStorage:", err);
      }
    }

    // 從 localStorage 讀取指定年月份資料
    function loadFromStorage(year, month) {
      if (year === undefined) year = currentSelectedYear;
      if (month === undefined) month = currentSelectedMonth;

      try {
        const key = getMonthStorageKey(year, month);
        const savedRaw = localStorage.getItem(key);

        if (savedRaw !== null) {
          const data = JSON.parse(savedRaw);
          items = Array.isArray(data.items) ? data.items : [];
          const cashInput = document.getElementById("cashInput");
          if (cashInput) cashInput.value = (data.cash !== undefined) ? data.cash : "0";
        } else {
          // 若無紀錄：如果是當前自然月且初次使用，嘗試遷移舊單月份紀錄或使用示範資料
          const now = new Date();
          const legacyItems = localStorage.getItem("strawbreceipt_items");
          const legacyCash = localStorage.getItem("strawbreceipt_cash");

          if (year === now.getFullYear() && month === now.getMonth() && legacyItems !== null) {
            items = JSON.parse(legacyItems);
            const cashInput = document.getElementById("cashInput");
            if (cashInput) cashInput.value = (legacyCash !== null) ? legacyCash : "600";
            saveToStorage();
          } else if (year === now.getFullYear() && month === now.getMonth()) {
            items = JSON.parse(JSON.stringify(defaultData));
            const cashInput = document.getElementById("cashInput");
            if (cashInput) cashInput.value = "600";
          } else {
            // 切換到其他尚未記帳的月份：開立一筆空白收據
            items = [];
            const cashInput = document.getElementById("cashInput");
            if (cashInput) cashInput.value = "";
          }
        }
      } catch (err) {
        console.warn("讀取 localStorage 失敗:", err);
        items = [];
      }
    }

    // 格式化數字：無小數點 (四捨五入整數)
    function formatNumber(val) {
      if (val === null || val === undefined || isNaN(val) || val === "") return "0";
      return Math.round(Number(val)).toString();
    }

    // 渲染明細清單 (品項 ITEM -> 數量 QTY -> 金額 AMT)
    function renderItems() {
      const container = document.getElementById("itemsList");
      container.innerHTML = "";

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "item-row";
        row.innerHTML = `
          <input type="text" class="input-item" value="${escapeHtml(item.item)}"
            placeholder="Item"
            oninput="updateItem(${index}, 'item', this.value)" />
          <input type="number" class="input-qty" value="${item.qty}" min="0" step="any"
            placeholder="Qty"
            oninput="updateItem(${index}, 'qty', this.value)" />
          <input type="number" class="input-amt" value="${formatNumber(item.amt)}" step="1"
            placeholder="Amt"
            oninput="updateItem(${index}, 'amt', this.value)" />
          <button class="btn-delete" title="Delete Item" onclick="deleteItem(${index})">✕</button>
        `;
        container.appendChild(row);
      });

      calculateTotal();
    }

    // 聚焦並選取目標欄位所有文字內容 (方便直接輸入覆蓋)
    function focusAndSelect(el) {
      if (!el) return;
      el.focus();
      if (el.tagName === 'INPUT') {
        el.select();
      } else if (el.isContentEditable) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    // 取得收據上所有可輸入欄位的循序陣列
    function getFocusableFields() {
      const list = [];
      const titleTag = document.querySelector(".title-tag");
      const shopName = document.querySelector(".shop-name");
      const shopInfo = document.querySelector(".shop-info");
      const receiptDate = document.getElementById("receiptDate");
      const receiptTime = document.getElementById("receiptTime");

      if (titleTag) list.push(titleTag);
      if (shopName) list.push(shopName);
      if (shopInfo) list.push(shopInfo);
      if (receiptDate) list.push(receiptDate);
      if (receiptTime) list.push(receiptTime);

      const rows = document.querySelectorAll(".item-row");
      rows.forEach(r => {
        const itemInput = r.querySelector(".input-item");
        const qtyInput = r.querySelector(".input-qty");
        const amtInput = r.querySelector(".input-amt");
        if (itemInput) list.push(itemInput);
        if (qtyInput) list.push(qtyInput);
        if (amtInput) list.push(amtInput);
      });

      const cashInput = document.getElementById("cashInput");
      const footer = document.querySelector(".receipt-footer");
      if (cashInput) list.push(cashInput);
      if (footer) list.push(footer);

      return list;
    }

    // 全域鍵盤導航：任何輸入欄按 Enter 絕對不換行，直接跳到下一個輸入格
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        const active = document.activeElement;
        if (!active) return;

        const isInput = active.tagName === 'INPUT';
        const isEditable = active.isContentEditable;

        if (isInput || isEditable) {
          // 徹底阻止任何在輸入框或 contenteditable 內部的預設換行行為
          event.preventDefault();

          // 若在明細行的最後一個金額 (input-amt) 按 Enter
          if (active.classList.contains('input-amt')) {
            const rows = document.querySelectorAll(".item-row");
            const lastRow = rows[rows.length - 1];
            const isLastRow = lastRow && lastRow.querySelector('.input-amt') === active;

            if (isLastRow) {
              const lastItem = items[items.length - 1];
              // 若最後一行已填寫品名，按 Enter 自動加行繼續輸入
              if (lastItem && lastItem.item && lastItem.item.trim() !== '') {
                addNewItem();
                return;
              }
            }
          }

          // 一般情況：依序跳到下一個輸入格
          if (datePickerInstance && typeof datePickerInstance.close === 'function') {
            datePickerInstance.close();
          }

          const fields = getFocusableFields();
          const currentIndex = fields.indexOf(active);

          if (currentIndex !== -1) {
            const nextIndex = (currentIndex + 1) % fields.length;
            focusAndSelect(fields[nextIndex]);
          }
        }
      }
    });

    // 安全跳脫字元
    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // 更新品項值與連動計算 (無小數點)
    function updateItem(index, field, value) {
      const item = items[index];
      if (!item) return;

      if (field === 'qty') {
        const qty = parseFloat(value) || 0;
        item.qty = qty;

        // 當數量變更時，後方金額 AMT 自動依單價連動計算 (無小數點整數)
        const unitPrice = (typeof item.unitPrice === 'number' && !isNaN(item.unitPrice)) ? item.unitPrice : 0;
        const newAmt = Math.round(qty * unitPrice);
        item.amt = newAmt;

        // 即時更新該列對應的 AMT 輸入框，無需重繪整個列表以維持輸入焦點
        const rows = document.querySelectorAll(".item-row");
        if (rows[index]) {
          const amtInput = rows[index].querySelector(".input-amt");
          if (amtInput) {
            amtInput.value = formatNumber(newAmt);
          }
        }
      } else if (field === 'amt') {
        const amt = Math.round(parseFloat(value) || 0);
        item.amt = amt;
        // 使用者手動調整金額時，自動反推並更新單價
        const currentQty = item.qty || 1;
        item.unitPrice = currentQty > 0 ? (amt / currentQty) : amt;
      } else {
        item.item = value;
      }
      calculateTotal();
      saveToStorage();
    }

    // 新增品項
    function addNewItem() {
      items.push({ qty: 1, item: "", unitPrice: 0, amt: 0 });
      saveToStorage();
      renderItems();

      // 自動聚焦到新加入的品項名稱輸入框
      setTimeout(() => {
        const rows = document.querySelectorAll(".item-row");
        if (rows.length > 0) {
          const lastInput = rows[rows.length - 1].querySelector(".input-item");
          if (lastInput) {
            lastInput.focus();
            lastInput.select();
          }
        }
      }, 50);
    }

    // 刪除品項
    function deleteItem(index) {
      items.splice(index, 1);
      saveToStorage();
      renderItems();
    }

    // 清空品項 (全部清除時一併重置儲存快取)
    function clearAllItems() {
      items = [];
      const cashInput = document.getElementById("cashInput");
      if (cashInput) cashInput.value = "";
      clearStorage();
      renderItems();
    }

    // 重置範例資料 (同步覆寫儲存快取)
    function resetDefaultItems() {
      items = JSON.parse(JSON.stringify(defaultData));
      const cashInput = document.getElementById("cashInput");
      if (cashInput) cashInput.value = "600";
      saveToStorage();
      updateCurrentDateTime();
      renderItems();
    }

    // 計算總額與找零 (無小數點)
    function calculateTotal() {
      let total = 0;
      items.forEach(item => {
        const amt = Math.round(parseFloat(item.amt) || 0);
        total += amt;
      });

      const formattedTotal = formatNumber(total);
      document.getElementById("totalAmount").textContent = formattedTotal;

      // 找零計算
      const cashVal = parseFloat(document.getElementById("cashInput").value);
      const changeElem = document.getElementById("changeAmount");

      if (!isNaN(cashVal)) {
        const change = Math.round(cashVal - total);
        changeElem.textContent = formatNumber(change);
      } else {
        changeElem.textContent = "0";
      }
    }

    // Flatpickr 實例變數
    let datePickerInstance = null;

    // 英文月份名稱列表 (純小寫)
    const monthNames = [
      "january", "february", "march", "april", "may", "june",
      "july", "august", "september", "october", "november", "december"
    ];

    // 更新收據抬頭為對應月份英文 (例如 9 月顯示 september)
    function updateShopMonth(date) {
      if (!date || !(date instanceof Date) || isNaN(date.getTime())) return;
      const shopName = document.querySelector(".shop-name");
      if (shopName) {
        shopName.textContent = monthNames[date.getMonth()];
      }
    }

    // 更新當前日期與時間
    function updateCurrentDateTime() {
      const now = new Date();

      // 連動更新收據抬頭的月份英文
      updateShopMonth(now);

      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const yyyy = now.getFullYear();

      if (datePickerInstance) {
        datePickerInstance.setDate(now, true, "m/d/Y");
      } else {
        const dateInput = document.getElementById("receiptDate");
        if (dateInput) {
          dateInput.value = `${mm}/${dd}/${yyyy}`;
        }
      }

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strHours = String(hours).padStart(2, '0');

      document.getElementById("receiptTime").textContent = `${strHours}:${minutes}:${seconds} ${ampm}`;
    }

    // 匯出收據圖片 (PNG)
    async function exportReceiptImage() {
      const receipt = document.getElementById("receipt");
      const delButtons = document.querySelectorAll(".btn-delete, .add-row-zone");

      // 截圖前暫時隱藏輔助操作按鈕
      delButtons.forEach(el => el.style.visibility = "hidden");

      try {
        const canvas = await html2canvas(receipt, {
          backgroundColor: null,
          scale: 2 // 高清晰度匯出
        });

        const link = document.createElement("a");
        link.download = `Receipt_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) {
        alert("Image export failed. Please use your browser's print or screenshot feature.");
      } finally {
        delButtons.forEach(el => el.style.visibility = "visible");
      }
    }

    // =========================================
    // 漢堡選單與月份記錄切換控制
    // =========================================
    function toggleMonthMenu(event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById("monthDropdownMenu");
      if (!menu) return;
      const isShowing = menu.classList.contains("show");
      if (isShowing) {
        menu.classList.remove("show");
      } else {
        renderMonthList();
        menu.classList.add("show");
      }
    }

    function closeMonthMenu() {
      const menu = document.getElementById("monthDropdownMenu");
      if (menu) menu.classList.remove("show");
    }

    // 渲染月份下拉清單 (標記當前選中與各月項目數)
    function renderMonthList() {
      const list = document.getElementById("monthList");
      const yearBadge = document.getElementById("dropdownYearBadge");
      if (!list) return;
      if (yearBadge) yearBadge.textContent = currentSelectedYear;

      list.innerHTML = "";
      monthNames.forEach((name, idx) => {
        const itemDiv = document.createElement("div");
        const isActive = (idx === currentSelectedMonth);
        itemDiv.className = `month-item ${isActive ? 'active' : ''}`;

        // 檢查該月份是否有儲存紀錄
        const key = getMonthStorageKey(currentSelectedYear, idx);
        const raw = localStorage.getItem(key);
        let badgeHtml = "";
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            const count = Array.isArray(parsed.items) ? parsed.items.length : 0;
            badgeHtml = `<span class="month-item-badge">${count} items</span>`;
          } catch (e) {
            badgeHtml = `<span class="month-item-badge">saved</span>`;
          }
        }

        itemDiv.innerHTML = `
          <span class="month-item-name">${name}</span>
          ${badgeHtml}
        `;

        itemDiv.onclick = (e) => {
          e.stopPropagation();
          selectMonth(idx);
        };

        list.appendChild(itemDiv);
      });
    }

    // 切換至特定月份紀錄
    function selectMonth(monthIndex) {
      if (monthIndex === currentSelectedMonth) {
        closeMonthMenu();
        return;
      }

      // 1. 自動儲存當前編輯中月份
      saveToStorage();

      // 2. 切換月份
      currentSelectedMonth = monthIndex;

      // 3. 載入該月份紀錄
      loadFromStorage(currentSelectedYear, currentSelectedMonth);

      // 4. 更新收據抬頭大字月份
      const targetDate = new Date(currentSelectedYear, currentSelectedMonth, 1);
      updateShopMonth(targetDate);

      // 5. 更新收據日期選擇器 Flatpickr 顯示
      const now = new Date();
      let displayDate;
      if (currentSelectedYear === now.getFullYear() && currentSelectedMonth === now.getMonth()) {
        displayDate = now;
      } else {
        displayDate = new Date(currentSelectedYear, currentSelectedMonth, 1);
      }

      if (datePickerInstance) {
        datePickerInstance.setDate(displayDate, false, "m/d/Y");
      } else {
        const dateInput = document.getElementById("receiptDate");
        if (dateInput) {
          const mm = String(displayDate.getMonth() + 1).padStart(2, '0');
          const dd = String(displayDate.getDate()).padStart(2, '0');
          const yyyy = displayDate.getFullYear();
          dateInput.value = `${mm}/${dd}/${yyyy}`;
        }
      }

      // 6. 重新渲染明細並計算
      renderItems();

      // 7. 更新選單外觀並收起
      renderMonthList();
      closeMonthMenu();
    }

    // =========================================
    // 年份快速切換控制
    // =========================================
    function changeYear(delta, event) {
      if (event) event.stopPropagation();
      // 1. 保存當前編輯狀態
      saveToStorage();

      // 2. 切換年份
      currentSelectedYear += delta;

      // 3. 更新顯示標籤
      const yearBadge = document.getElementById("dropdownYearBadge");
      if (yearBadge) yearBadge.textContent = currentSelectedYear;

      // 4. 載入新選年份對應月份的資料
      loadFromStorage(currentSelectedYear, currentSelectedMonth);

      // 5. 更新日期顯示與日曆元件
      const now = new Date();
      let displayDate;
      if (currentSelectedYear === now.getFullYear() && currentSelectedMonth === now.getMonth()) {
        displayDate = now;
      } else {
        displayDate = new Date(currentSelectedYear, currentSelectedMonth, 1);
      }

      updateShopMonth(displayDate);
      if (datePickerInstance) {
        datePickerInstance.setDate(displayDate, false, "m/d/Y");
      } else {
        const dateInput = document.getElementById("receiptDate");
        if (dateInput) {
          const mm = String(displayDate.getMonth() + 1).padStart(2, '0');
          const dd = String(displayDate.getDate()).padStart(2, '0');
          const yyyy = displayDate.getFullYear();
          dateInput.value = `${mm}/${dd}/${yyyy}`;
        }
      }

      // 6. 重新渲染明細清單與月份下拉清單
      renderItems();
      renderMonthList();
      saveToStorage();
    }

    // =========================================
    // 設定分頁彈窗與主題切換控制
    // =========================================
    function openSettingsModal() {
      closeMonthMenu();
      const modal = document.getElementById("settingsModalOverlay");
      if (modal) modal.classList.add("show");
    }

    function closeSettingsModal() {
      const modal = document.getElementById("settingsModalOverlay");
      if (modal) modal.classList.remove("show");
    }

    function closeSettingsModalOnOverlay(event) {
      if (event.target === document.getElementById("settingsModalOverlay")) {
        closeSettingsModal();
      }
    }

    // 主題色彩切換
    function applyTheme(theme) {
      if (!theme) theme = "rose";
      document.documentElement.setAttribute("data-theme", theme);
      const themeSelect = document.getElementById("themeSelect");
      if (themeSelect && themeSelect.value !== theme) {
        themeSelect.value = theme;
      }
      try {
        localStorage.setItem("strawbreceipt_theme", theme);
      } catch (e) {
        console.warn("無法儲存主題設定:", e);
      }
    }

    function onThemeChange(theme) {
      applyTheme(theme);
      showToast("已切換主題風格");
    }

    function initTheme() {
      let savedTheme = "rose";
      try {
        savedTheme = localStorage.getItem("strawbreceipt_theme") || "rose";
      } catch (e) { }
      applyTheme(savedTheme);
    }

    // 簡易浮動提示
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("settingsToast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }

    // =========================================
    // 資料匯出與匯入功能 (Backup & Restore)
    // =========================================
    // 匯出全部資料為 JSON 檔案
    function exportAllData() {
      saveToStorage(); // 確保最新編輯已寫入

      const backupData = {
        app: "Receiptism",
        version: "1.0",
        exportAt: new Date().toISOString(),
        records: {},
        theme: localStorage.getItem("strawbreceipt_theme") || "rose",
        lastSelected: localStorage.getItem("strawbreceipt_last_selected") || `${currentSelectedYear}-${currentSelectedMonth}`
      };

      // 遍歷 localStorage 蒐集所有收據資料
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("strawbreceipt_") && key !== "strawbreceipt_theme") {
          try {
            backupData.records[key] = JSON.parse(localStorage.getItem(key));
          } catch (e) {
            backupData.records[key] = localStorage.getItem(key);
          }
        }
      }

      const jsonStr = JSON.stringify(backupData, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      link.download = `Receiptism_backup_${dateStr}.json`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);

      showToast("備份資料已成功匯出");
    }

    // 觸發隱藏檔案上傳按鈕
    function triggerImportFileInput() {
      const input = document.getElementById("importFileInput");
      if (input) {
        input.value = ""; // 清除前次選取的檔案
        input.click();
      }
    }

    // 處理檔案匯入
    function handleFileImport(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const content = e.target.result;
          const parsed = JSON.parse(content);

          let importedCount = 0;

          // 判斷是否為格式化備份檔
          if (parsed && parsed.records && typeof parsed.records === "object") {
            Object.keys(parsed.records).forEach(key => {
              const val = typeof parsed.records[key] === "object"
                ? JSON.stringify(parsed.records[key])
                : parsed.records[key];
              localStorage.setItem(key, val);
              importedCount++;
            });

            if (parsed.theme) {
              applyTheme(parsed.theme);
            }
          } else if (parsed && typeof parsed === "object") {
            // 相容其他 key-value 物件匯入
            Object.keys(parsed).forEach(key => {
              if (key.startsWith("strawbreceipt_")) {
                const val = typeof parsed[key] === "object" ? JSON.stringify(parsed[key]) : parsed[key];
                localStorage.setItem(key, val);
                importedCount++;
              }
            });
          } else {
            throw new Error("Invalid backup format");
          }

          // 重新載入目前年月份資料
          loadFromStorage(currentSelectedYear, currentSelectedMonth);
          renderItems();
          renderMonthList();
          showToast(`已成功匯入 ${importedCount} 筆記帳資料`);
          closeSettingsModal();
        } catch (err) {
          console.error("匯入失敗:", err);
          alert("匯入失敗：檔案格式不正確或已毀損，請選取正確的 JSON 備份檔。");
        }
      };

      reader.readAsText(file);
    }

    // 點擊選單外部自動關閉下拉面板
    document.addEventListener("click", function (event) {
      const container = document.querySelector(".menu-dropdown-container");
      if (container && !container.contains(event.target)) {
        closeMonthMenu();
      }
    });

    // 支援按 ESC 關閉 Modal 或下拉選單
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeSettingsModal();
        closeMonthMenu();
      }
    });

    // 啟動初始化
    window.addEventListener("DOMContentLoaded", () => {
      // 初始化介面主題
      initTheme();

      // 讀取上次選取的年月份 (若有記錄)
      const lastSelected = localStorage.getItem("strawbreceipt_last_selected");
      if (lastSelected) {
        const parts = lastSelected.split("-");
        if (parts.length === 2) {
          const yr = parseInt(parts[0], 10);
          const mo = parseInt(parts[1], 10);
          if (!isNaN(yr) && !isNaN(mo)) {
            currentSelectedYear = yr;
            currentSelectedMonth = mo;
          }
        }
      }

      // 讀取當前月份的儲存資料
      loadFromStorage(currentSelectedYear, currentSelectedMonth);
      renderMonthList();

      // 初始化 Flatpickr 淺粉色選單套件
      if (typeof flatpickr !== "undefined") {
        datePickerInstance = flatpickr("#receiptDate", {
          dateFormat: "m/d/Y",
          defaultDate: new Date(currentSelectedYear, currentSelectedMonth, new Date().getDate()),
          disableMobile: true,
          animate: true,
          monthSelectorType: "static",
          onChange: function (selectedDates) {
            if (selectedDates && selectedDates.length > 0) {
              const sel = selectedDates[0];
              updateShopMonth(sel);
              // 若在日期小套件中挑選了不同月份，自動切換該月份紀錄！
              if (sel.getMonth() !== currentSelectedMonth || sel.getFullYear() !== currentSelectedYear) {
                saveToStorage();
                currentSelectedYear = sel.getFullYear();
                currentSelectedMonth = sel.getMonth();
                loadFromStorage(currentSelectedYear, currentSelectedMonth);
                renderItems();
                renderMonthList();
              }
            }
          }
        });
      }

      updateCurrentDateTime();
      renderItems();
    });
  </script>
</body>

</html>
