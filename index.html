<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt Calculator</title>
  <link rel="icon" type="image/png" href="strawberry.png">
  <link rel="apple-touch-icon" href="strawberry.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <!-- 引入 Chiron GoRound TC (昭源圓體) 中文字型 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/chiron-goround-tc@latest/index.css">
  <!-- 引入 html2canvas 支援收據截圖匯出 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- 引入 flatpickr 日期選單套件 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    :root {
      --bg-plane: #e4dede;
      --bg-receipt: #f3ecec;
      --text-main: #5a4b56;
      --text-button: #74616e;
      --receipt-width: 380px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 全域文字反白選取改為典雅粉灰色 */
    ::selection {
      background-color: #d8c7c9;
      color: var(--text-main);
    }

    ::-moz-selection {
      background-color: #d8c7c9;
      color: var(--text-main);
    }

    body {
      background-color: var(--bg-plane);
      color: var(--text-main);
      font-family: 'Courier Prime', 'Chiron GoRound TC', 'Chiron Hei HK', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
      user-select: none;
    }

    /* 液態玻璃樣式懸浮選單 DOCK */
    .toolbar {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 26px;
      padding: 20px 28px;
      border-radius: 36px;
      z-index: 10;

      /* 1. 高透光底色 與 2. 135° 對角水珠亮點邊框 (135° Specular Border) */
      border: 1.5px solid transparent;
      background:
        linear-gradient(rgba(247, 237, 235, 0.25), rgba(247, 237, 235, 0.25)) padding-box,
        linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.35) 25%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.35) 75%, rgba(255, 255, 255, 0.85) 100%) border-box;

      /* 跨瀏覽器光學折射濾鏡 */
      -webkit-backdrop-filter: blur(1.5px) saturate(200%) contrast(125%) brightness(90%);
      backdrop-filter: blur(1.5px) saturate(200%) contrast(125%) brightness(90%);

      /* 輕盈柔和外層投影 */
      box-shadow: 0 4px 20px 0 rgba(73, 58, 57, 0.035), 0 1px 4px 0 rgba(0, 0, 0, 0.015);
    }

    /* 3. 無界線羽化漸層反光圈 (Feathered Rim Aura ::after) */
    .toolbar::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 36px;
      box-shadow:
        inset 0 1.5px 6px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1.5px 6px 0 rgba(255, 255, 255, 0.35),
        inset 0 0 8px 1px rgba(255, 255, 255, 0.3);
      filter: blur(1px);
      border: none;
      pointer-events: none;
      z-index: 1;
    }

    /* DOCK 內部的淺粉灰色塊按鈕 (無玻璃效果、無外框) */
    .btn {
      position: relative;
      z-index: 2;
      color: var(--text-button);
      border: none;
      outline: none;
      border-radius: 18px;
      padding: 10px 20px;
      font-size: 13px;
      font-family: 'PT Serif', 'Chiron GoRound TC', serif;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      background-color: #e4d2d7ec;
      box-shadow: 0 1px 2px rgba(90, 75, 86, 0.06);
    }

    .btn:hover {
      background-color: #cab8c0;
      transform: translateY(-1px);
    }

    .btn:active {
      background-color: #e0ccce;
      transform: translateY(0);
      box-shadow: none;
    }

    /* 主要按鈕也是淺粉灰色塊 */
    .btn-primary {
      background-color: #e4d2d7ec;
      color: var(--text-button);
      font-weight: 700;
    }

    .btn-primary:hover {
      background-color: #cab8c0;
      transform: translateY(-1px);
    }

    /* 收據外層容器（柔和立體陰影） */
    .receipt-container {
      position: relative;
      width: 100%;
      max-width: var(--receipt-width);
      filter: drop-shadow(0 14px 24px rgba(73, 58, 57, 0.12)) drop-shadow(0 3px 6px rgba(73, 58, 57, 0.06));
    }

    /* 收據主體 */
    .receipt {
      background-color: var(--bg-receipt);
      width: 100%;
      position: relative;
      padding: 26px 22px;
      /* 模擬紙張質地細微斑駁感 */
      background-image: radial-gradient(rgba(73, 58, 57, 0.03) 1px, transparent 0);
      background-size: 16px 16px;

      /* 上下鋸齒撕紙邊緣 (Zigzag / Perforated effect) */
      --sawtooth-size: 8px;
      clip-path: polygon(
          /* 頂部鋸齒波浪 */
          0% var(--sawtooth-size),
          2% 0, 4% var(--sawtooth-size), 6% 0, 8% var(--sawtooth-size), 10% 0,
          12% var(--sawtooth-size), 14% 0, 16% var(--sawtooth-size), 18% 0, 20% var(--sawtooth-size),
          22% 0, 24% var(--sawtooth-size), 26% 0, 28% var(--sawtooth-size), 30% 0,
          32% var(--sawtooth-size), 34% 0, 36% var(--sawtooth-size), 38% 0, 40% var(--sawtooth-size),
          42% 0, 44% var(--sawtooth-size), 46% 0, 48% var(--sawtooth-size), 50% 0,
          52% var(--sawtooth-size), 54% 0, 56% var(--sawtooth-size), 58% 0, 60% var(--sawtooth-size),
          62% 0, 64% var(--sawtooth-size), 66% 0, 68% var(--sawtooth-size), 70% 0,
          72% var(--sawtooth-size), 74% 0, 76% var(--sawtooth-size), 78% 0, 80% var(--sawtooth-size),
          82% 0, 84% var(--sawtooth-size), 86% 0, 88% var(--sawtooth-size), 90% 0,
          92% var(--sawtooth-size), 94% 0, 96% var(--sawtooth-size), 98% 0, 100% var(--sawtooth-size),
          /* 右邊界 */
          100% calc(100% - var(--sawtooth-size)),
          /* 底部鋸齒波浪 */
          98% 100%, 96% calc(100% - var(--sawtooth-size)), 94% 100%, 92% calc(100% - var(--sawtooth-size)),
          90% 100%, 88% calc(100% - var(--sawtooth-size)), 86% 100%, 84% calc(100% - var(--sawtooth-size)),
          82% 100%, 80% calc(100% - var(--sawtooth-size)), 78% 100%, 76% calc(100% - var(--sawtooth-size)),
          74% 100%, 72% calc(100% - var(--sawtooth-size)), 70% 100%, 68% calc(100% - var(--sawtooth-size)),
          66% 100%, 64% calc(100% - var(--sawtooth-size)), 62% 100%, 60% calc(100% - var(--sawtooth-size)),
          58% 100%, 56% calc(100% - var(--sawtooth-size)), 54% 100%, 52% calc(100% - var(--sawtooth-size)),
          50% 100%, 48% calc(100% - var(--sawtooth-size)), 46% 100%, 44% calc(100% - var(--sawtooth-size)),
          42% 100%, 40% calc(100% - var(--sawtooth-size)), 38% 100%, 36% calc(100% - var(--sawtooth-size)),
          34% 100%, 32% calc(100% - var(--sawtooth-size)), 30% 100%, 28% calc(100% - var(--sawtooth-size)),
          26% 100%, 24% calc(100% - var(--sawtooth-size)), 22% 100%, 20% calc(100% - var(--sawtooth-size)),
          18% 100%, 16% calc(100% - var(--sawtooth-size)), 14% 100%, 12% calc(100% - var(--sawtooth-size)),
          10% 100%, 8% calc(100% - var(--sawtooth-size)), 6% 100%, 4% calc(100% - var(--sawtooth-size)),
          2% 100%, 0% calc(100% - var(--sawtooth-size)));
    }

    /* 可編輯文字點擊效果 */
    [contenteditable="true"] {
      outline: none;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.2s, background-color 0.2s;
      user-select: text;
    }

    [contenteditable="true"]:hover {
      border-bottom-color: rgba(90, 75, 86, 0.4);
      background-color: rgba(216, 199, 201, 0.25);
    }

    [contenteditable="true"]:focus {
      border-bottom-color: var(--text-main);
      background-color: #e8dcdf;
    }

    /* 收據頭部 */
    .receipt-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .title-tag {
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .shop-name {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin: 6px 0;
      text-transform: none;
    }

    .shop-info {
      font-size: 11px;
      line-height: 1.5;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    /* 虛線分隔線 */
    .divider {
      border: none;
      border-top: 1px dashed var(--text-main);
      margin: 12px 0;
      opacity: 0.75;
    }

    /* 日期時間列 */
    .receipt-datetime {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 0;
      letter-spacing: 0.5px;
    }

    /* 日期選擇輸入框 (收據內襯線風格) */
    .receipt-date-input {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      width: 110px;
      padding: 1px 4px;
      border-bottom: 1px dashed transparent;
      border-radius: 3px;
      transition: all 0.2s ease;
      outline: none;
    }

    .receipt-date-input:hover {
      border-bottom-color: rgba(90, 75, 86, 0.4);
      background-color: rgba(216, 199, 201, 0.3);
    }

    .receipt-date-input:focus {
      border-bottom-color: var(--text-main);
      background-color: #e8dcdf;
    }

    /* =========================================
       Flatpickr 淺粉灰色系客製主題 (Custom Soft Pink Theme)
       ========================================= */
    .flatpickr-calendar {
      background: #faf5f3 !important;
      border: 1px solid #ebdada !important;
      border-radius: 18px !important;
      box-shadow: 0 12px 30px rgba(90, 75, 86, 0.12), 0 3px 8px rgba(90, 75, 86, 0.05) !important;
      font-family: 'Courier Prime', 'PT Serif', 'Chiron GoRound TC', sans-serif !important;
      color: var(--text-main) !important;
      padding: 10px 8px !important;
      width: 290px !important;
    }

    /* 氣泡小箭頭顏色配合 */
    .flatpickr-calendar.arrowTop:before,
    .flatpickr-calendar.arrowTop:after {
      border-bottom-color: #faf4f3 !important;
    }

    .flatpickr-calendar.arrowBottom:before,
    .flatpickr-calendar.arrowBottom:after {
      border-top-color: #faf4f3 !important;
    }

    /* 月份標頭區：彈性置中佈局，左右預留箭頭安全空間 */
    .flatpickr-months {
      position: relative !important;
      background: transparent !important;
      height: 42px !important;
      padding: 0 50px !important;
      border-bottom: 1px dashed #e4d4d8 !important;
      margin-bottom: 8px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box !important;
    }

    .flatpickr-month {
      width: 100% !important;
      height: 100% !important;
      color: var(--text-main) !important;
      fill: var(--text-main) !important;
      position: static !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
    }

    /* 月份年份標題：重設絕對定位與偏位，實現精確正中對齊 */
    .flatpickr-current-month {
      position: static !important;
      left: auto !important;
      right: auto !important;
      top: auto !important;
      bottom: auto !important;
      width: auto !important;
      transform: none !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 6px !important;
      padding: 0 !important;
      margin: 0 auto !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      color: var(--text-main) !important;
      line-height: 1 !important;
      height: auto !important;
    }

    .flatpickr-current-month .cur-month {
      font-weight: 700 !important;
      color: var(--text-main) !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .flatpickr-current-month .numInputWrapper {
      display: inline-flex !important;
      align-items: center !important;
      width: 46px !important;
    }

    .flatpickr-current-month input.cur-year {
      font-weight: 700 !important;
      color: var(--text-main) !important;
      font-family: inherit !important;
      font-size: inherit !important;
      padding: 0 !important;
      margin: 0 !important;
      height: auto !important;
      vertical-align: middle !important;
    }

    /* 月份切換左右箭頭按鈕：垂直絕對居中 (top: 50%)，不爆框不位移 */
    .flatpickr-months .flatpickr-prev-month,
    .flatpickr-months .flatpickr-next-month {
      position: absolute !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      width: 28px !important;
      height: 28px !important;
      padding: 0 !important;
      border-radius: 9px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: var(--text-button) !important;
      fill: var(--text-button) !important;
      transition: all 0.2s ease !important;
      z-index: 5 !important;
    }

    .flatpickr-months .flatpickr-prev-month {
      left: 8px !important;
    }

    .flatpickr-months .flatpickr-next-month {
      right: 8px !important;
    }

    .flatpickr-months .flatpickr-prev-month svg,
    .flatpickr-months .flatpickr-next-month svg {
      width: 13px !important;
      height: 13px !important;
      fill: var(--text-button) !important;
    }

    .flatpickr-months .flatpickr-prev-month:hover,
    .flatpickr-months .flatpickr-next-month:hover {
      background: #ebdada !important;
      color: var(--text-main) !important;
      fill: var(--text-main) !important;
    }

    /* 星期標籤 (週一到週日) */
    span.flatpickr-weekday {
      color: #8f7988 !important;
      font-weight: 700 !important;
      font-size: 80% !important;
    }

    /* 日曆日期格 */
    .flatpickr-day {
      color: var(--text-main) !important;
      border-radius: 10px !important;
      border: 1px solid transparent !important;
      font-weight: 500 !important;
      height: 34px !important;
      line-height: 34px !important;
      margin: 2px !important;
      transition: all 0.15s ease !important;
    }

    .flatpickr-day:hover {
      background: #ebdada !important;
      border-color: #ebdada !important;
      color: var(--text-main) !important;
    }

    /* 今日標記 */
    .flatpickr-day.today {
      border: 1.5px dashed #caa8b2 !important;
      background: rgba(235, 218, 218, 0.4) !important;
      color: var(--text-main) !important;
    }

    /* 選取日期 (淺粉灰塊) */
    .flatpickr-day.selected,
    .flatpickr-day.startRange,
    .flatpickr-day.endRange {
      background: #d4bcc5 !important;
      border-color: #d4bcc5 !important;
      color: #3f313c !important;
      font-weight: 700 !important;
      box-shadow: 0 2px 6px rgba(133, 98, 114, 0.25) !important;
    }

    .flatpickr-day.selected:hover {
      background: #c7abb6 !important;
      border-color: #c7abb6 !important;
    }

    /* 非當月日期 (淡化) */
    .flatpickr-day.prevMonthDay,
    .flatpickr-day.nextMonthDay {
      color: #baa8b0 !important;
      opacity: 0.65 !important;
    }

    /* 明細表頭 (品項 | 數量 | 單價金額) */
    .receipt-table-header {
      display: grid;
      grid-template-columns: 1fr 48px 70px 24px;
      font-size: 13px;
      font-weight: 700;
      padding-bottom: 5px;
      border-bottom: 1px dashed var(--text-main);
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .col-item {
      text-align: left;
      padding-left: 2px;
    }

    .col-qty {
      text-align: center;
    }

    .col-amt {
      text-align: right;
    }

    .col-action {
      text-align: center;
    }

    /* 明細列表項目 */
    .items-list {
      margin: 8px 0 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 1fr 48px 70px 24px;
      align-items: center;
      font-size: 13px;
      min-height: 24px;
    }

    .item-row input {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      padding: 2px 4px;
      outline: none;
      width: 100%;
    }

    .item-row input:focus {
      background-color: #e8dcdf;
      border-bottom: 1px dashed var(--text-main);
      border-radius: 2px;
    }

    .item-row input.input-item {
      text-align: left;
    }

    .item-row input.input-qty {
      text-align: center;
    }

    .item-row input.input-amt {
      text-align: right;
    }

    /* 刪除品項按鈕 */
    .btn-delete {
      background: none;
      border: none;
      color: rgba(73, 58, 57, 0.35);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .btn-delete:hover {
      color: #944040;
    }

    /* 行內新增按鈕 */
    .add-row-zone {
      text-align: center;
      margin: 6px 0 10px;
    }

    .btn-inline-add {
      background: none;
      border: 1px dashed rgba(73, 58, 57, 0.35);
      border-radius: 4px;
      color: rgba(73, 58, 57, 0.8);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-inline-add:hover {
      border-color: var(--text-main);
      background-color: rgba(73, 58, 57, 0.05);
      color: var(--text-main);
    }

    /* 結算合計區塊 */
    .receipt-summary {
      margin-top: 6px;
      border-top: 1px dashed var(--text-main);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .summary-row.total-row {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .summary-row input {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      text-align: right;
      width: 110px;
      outline: none;
    }

    .summary-row input:focus {
      background-color: #e8dcdf;
      border-bottom: 1px dashed var(--text-main);
      border-radius: 2px;
    }

    .summary-val {
      font-weight: 700;
    }

    /* 收據頁尾 */
    .receipt-footer {
      text-align: center;
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* 列印與純淨匯出樣式 */
    @media print {
      body {
        background: #fff !important;
        padding: 0;
      }

      .toolbar,
      .btn-delete,
      .add-row-zone {
        display: none !important;
      }

      .receipt-container {
        filter: none;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- 工具列 -->
  <div class="toolbar">
    <button class="btn btn-primary" onclick="addNewItem()">+ Add Item</button>
    <button class="btn" onclick="updateCurrentDateTime()">Update Time</button>
    <button class="btn" onclick="clearAllItems()">Clear All</button>
    <button class="btn" onclick="resetDefaultItems()">Reset Demo</button>
    <button class="btn" onclick="exportReceiptImage()">Export Image</button>
    <button class="btn" onclick="window.print()">Print</button>
  </div>

  <!-- 收據主體容器 -->
  <div class="receipt-container" id="receiptContainer">
    <div class="receipt" id="receipt">

      <!-- 抬頭與店名資訊 (包含 strawberry 圖示) -->
      <div class="receipt-header">
        <div class="title-tag" contenteditable="true" spellcheck="false">Receiptism</div>
        <div class="shop-name" contenteditable="true" spellcheck="false">september</div>
        <div class="shop-info" contenteditable="true" spellcheck="false">
          Address: Lorem Ipsum, 1234-5<br>
          Tel: +1 012 345 67 89
        </div>
      </div>

      <hr class="divider">

      <!-- 日期與時間 -->
      <div class="receipt-datetime">
        <input type="text" id="receiptDate" class="receipt-date-input" readonly spellcheck="false" value="11/12/2026"
          placeholder="MM/DD/YYYY" title="點擊選擇日期" />
        <span id="receiptTime" contenteditable="true" spellcheck="false">11:13:06 AM</span>
      </div>

      <hr class="divider">

      <!-- 明細表頭 (品項 | 數量 | 金額) -->
      <div class="receipt-table-header">
        <span class="col-item">ITEM</span>
        <span class="col-qty">QTY</span>
        <span class="col-amt">AMT</span>
        <span class="col-action"></span>
      </div>

      <!-- 明細列表 -->
      <div class="items-list" id="itemsList">
        <!-- JS 動態渲染品項 -->
      </div>

      <!-- 快速加行 -->
      <div class="add-row-zone">
        <button class="btn-inline-add" onclick="addNewItem()">+ Add New Row</button>
      </div>

      <!-- 總額、實收與找零 (無小數點) -->
      <div class="receipt-summary">
        <div class="summary-row total-row">
          <span>Total</span>
          <span class="summary-val" id="totalAmount">0</span>
        </div>
        <div class="summary-row">
          <span>Cash</span>
          <input type="number" id="cashInput" step="1" placeholder="0" oninput="calculateTotal(); saveToStorage();" />
        </div>
        <div class="summary-row">
          <span>Change</span>
          <span class="summary-val" id="changeAmount">0</span>
        </div>
      </div>

      <hr class="divider">

      <!-- 結尾致謝詞 -->
      <div class="receipt-footer" contenteditable="true" spellcheck="false">
        THANK YOU!
      </div>

    </div>
  </div>

  <script>
    // 預設示範資料 (純整數無小數點，經典英文品項)
    const defaultData = [
      { qty: 1, item: "Americano", unitPrice: 65, amt: 65 },
      { qty: 2, item: "Croissant", unitPrice: 45, amt: 90 },
      { qty: 1, item: "Cafe Latte", unitPrice: 85, amt: 85 },
      { qty: 1, item: "Espresso", unitPrice: 50, amt: 50 },
      { qty: 2, item: "Handmade Cookie", unitPrice: 35, amt: 70 },
      { qty: 1, item: "Caramel Macchiato", unitPrice: 95, amt: 95 },
      { qty: 2, item: "Chocolate Scone", unitPrice: 40, amt: 80 },
      { qty: 1, item: "Cinnamon Roll", unitPrice: 80, amt: 80 }
    ];

    let items = JSON.parse(JSON.stringify(defaultData));

    // 本地快取 Storage Key
    const STORAGE_ITEMS_KEY = "strawbreceipt_items";
    const STORAGE_CASH_KEY = "strawbreceipt_cash";

    // 儲存至 localStorage (儲存品項與實收金額)
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_ITEMS_KEY, JSON.stringify(items));
        const cashInput = document.getElementById("cashInput");
        if (cashInput) {
          localStorage.setItem(STORAGE_CASH_KEY, cashInput.value);
        }
      } catch (err) {
        console.warn("無法儲存至 localStorage:", err);
      }
    }

    // 清除 localStorage (重設或全部清除時調用)
    function clearStorage() {
      try {
        localStorage.removeItem(STORAGE_ITEMS_KEY);
        localStorage.removeItem(STORAGE_CASH_KEY);
      } catch (err) {
        console.warn("無法清除 localStorage:", err);
      }
    }

    // 從 localStorage 讀取上次儲存資料
    function loadFromStorage() {
      try {
        const savedItems = localStorage.getItem(STORAGE_ITEMS_KEY);
        const savedCash = localStorage.getItem(STORAGE_CASH_KEY);

        if (savedItems !== null) {
          items = JSON.parse(savedItems);
        } else {
          items = JSON.parse(JSON.stringify(defaultData));
        }

        const cashInput = document.getElementById("cashInput");
        if (cashInput) {
          cashInput.value = (savedCash !== null) ? savedCash : "600";
        }
      } catch (err) {
        console.warn("讀取 localStorage 失敗:", err);
        items = JSON.parse(JSON.stringify(defaultData));
      }
    }

    // 格式化數字：無小數點 (四捨五入整數)
    function formatNumber(val) {
      if (val === null || val === undefined || isNaN(val) || val === "") return "0";
      return Math.round(Number(val)).toString();
    }

    // 渲染明細清單 (品項 ITEM -> 數量 QTY -> 金額 AMT)
    function renderItems() {
      const container = document.getElementById("itemsList");
      container.innerHTML = "";

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "item-row";
        row.innerHTML = `
          <input type="text" class="input-item" value="${escapeHtml(item.item)}"
            placeholder="Item"
            oninput="updateItem(${index}, 'item', this.value)" />
          <input type="number" class="input-qty" value="${item.qty}" min="0" step="any"
            placeholder="Qty"
            oninput="updateItem(${index}, 'qty', this.value)" />
          <input type="number" class="input-amt" value="${formatNumber(item.amt)}" step="1"
            placeholder="Amt"
            oninput="updateItem(${index}, 'amt', this.value)" />
          <button class="btn-delete" title="Delete Item" onclick="deleteItem(${index})">✕</button>
        `;
        container.appendChild(row);
      });

      calculateTotal();
    }

    // 聚焦並選取目標欄位所有文字內容 (方便直接輸入覆蓋)
    function focusAndSelect(el) {
      if (!el) return;
      el.focus();
      if (el.tagName === 'INPUT') {
        el.select();
      } else if (el.isContentEditable) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    // 取得收據上所有可輸入欄位的循序陣列
    function getFocusableFields() {
      const list = [];
      const titleTag = document.querySelector(".title-tag");
      const shopName = document.querySelector(".shop-name");
      const shopInfo = document.querySelector(".shop-info");
      const receiptDate = document.getElementById("receiptDate");
      const receiptTime = document.getElementById("receiptTime");

      if (titleTag) list.push(titleTag);
      if (shopName) list.push(shopName);
      if (shopInfo) list.push(shopInfo);
      if (receiptDate) list.push(receiptDate);
      if (receiptTime) list.push(receiptTime);

      const rows = document.querySelectorAll(".item-row");
      rows.forEach(r => {
        const itemInput = r.querySelector(".input-item");
        const qtyInput = r.querySelector(".input-qty");
        const amtInput = r.querySelector(".input-amt");
        if (itemInput) list.push(itemInput);
        if (qtyInput) list.push(qtyInput);
        if (amtInput) list.push(amtInput);
      });

      const cashInput = document.getElementById("cashInput");
      const footer = document.querySelector(".receipt-footer");
      if (cashInput) list.push(cashInput);
      if (footer) list.push(footer);

      return list;
    }

    // 全域鍵盤導航：任何輸入欄按 Enter 絕對不換行，直接跳到下一個輸入格
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        const active = document.activeElement;
        if (!active) return;

        const isInput = active.tagName === 'INPUT';
        const isEditable = active.isContentEditable;

        if (isInput || isEditable) {
          // 徹底阻止任何在輸入框或 contenteditable 內部的預設換行行為
          event.preventDefault();

          // 若在明細行的最後一個金額 (input-amt) 按 Enter
          if (active.classList.contains('input-amt')) {
            const rows = document.querySelectorAll(".item-row");
            const lastRow = rows[rows.length - 1];
            const isLastRow = lastRow && lastRow.querySelector('.input-amt') === active;

            if (isLastRow) {
              const lastItem = items[items.length - 1];
              // 若最後一行已填寫品名，按 Enter 自動加行繼續輸入
              if (lastItem && lastItem.item && lastItem.item.trim() !== '') {
                addNewItem();
                return;
              }
            }
          }

          // 一般情況：依序跳到下一個輸入格
          if (datePickerInstance && typeof datePickerInstance.close === 'function') {
            datePickerInstance.close();
          }

          const fields = getFocusableFields();
          const currentIndex = fields.indexOf(active);

          if (currentIndex !== -1) {
            const nextIndex = (currentIndex + 1) % fields.length;
            focusAndSelect(fields[nextIndex]);
          }
        }
      }
    });

    // 安全跳脫字元
    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // 更新品項值與連動計算 (無小數點)
    function updateItem(index, field, value) {
      const item = items[index];
      if (!item) return;

      if (field === 'qty') {
        const qty = parseFloat(value) || 0;
        item.qty = qty;

        // 當數量變更時，後方金額 AMT 自動依單價連動計算 (無小數點整數)
        const unitPrice = (typeof item.unitPrice === 'number' && !isNaN(item.unitPrice)) ? item.unitPrice : 0;
        const newAmt = Math.round(qty * unitPrice);
        item.amt = newAmt;

        // 即時更新該列對應的 AMT 輸入框，無需重繪整個列表以維持輸入焦點
        const rows = document.querySelectorAll(".item-row");
        if (rows[index]) {
          const amtInput = rows[index].querySelector(".input-amt");
          if (amtInput) {
            amtInput.value = formatNumber(newAmt);
          }
        }
      } else if (field === 'amt') {
        const amt = Math.round(parseFloat(value) || 0);
        item.amt = amt;
        // 使用者手動調整金額時，自動反推並更新單價
        const currentQty = item.qty || 1;
        item.unitPrice = currentQty > 0 ? (amt / currentQty) : amt;
      } else {
        item.item = value;
      }
      calculateTotal();
      saveToStorage();
    }

    // 新增品項
    function addNewItem() {
      items.push({ qty: 1, item: "", unitPrice: 0, amt: 0 });
      saveToStorage();
      renderItems();

      // 自動聚焦到新加入的品項名稱輸入框
      setTimeout(() => {
        const rows = document.querySelectorAll(".item-row");
        if (rows.length > 0) {
          const lastInput = rows[rows.length - 1].querySelector(".input-item");
          if (lastInput) {
            lastInput.focus();
            lastInput.select();
          }
        }
      }, 50);
    }

    // 刪除品項
    function deleteItem(index) {
      items.splice(index, 1);
      saveToStorage();
      renderItems();
    }

    // 清空品項 (全部清除時一併重置儲存快取)
    function clearAllItems() {
      items = [];
      const cashInput = document.getElementById("cashInput");
      if (cashInput) cashInput.value = "";
      clearStorage();
      renderItems();
    }

    // 重置範例資料 (同步覆寫儲存快取)
    function resetDefaultItems() {
      items = JSON.parse(JSON.stringify(defaultData));
      const cashInput = document.getElementById("cashInput");
      if (cashInput) cashInput.value = "600";
      saveToStorage();
      updateCurrentDateTime();
      renderItems();
    }

    // 計算總額與找零 (無小數點)
    function calculateTotal() {
      let total = 0;
      items.forEach(item => {
        const amt = Math.round(parseFloat(item.amt) || 0);
        total += amt;
      });

      const formattedTotal = formatNumber(total);
      document.getElementById("totalAmount").textContent = formattedTotal;

      // 找零計算
      const cashVal = parseFloat(document.getElementById("cashInput").value);
      const changeElem = document.getElementById("changeAmount");

      if (!isNaN(cashVal)) {
        const change = Math.round(cashVal - total);
        changeElem.textContent = formatNumber(change);
      } else {
        changeElem.textContent = "0";
      }
    }

    // Flatpickr 實例變數
    let datePickerInstance = null;

    // 英文月份名稱列表 (純小寫)
    const monthNames = [
      "january", "february", "march", "april", "may", "june",
      "july", "august", "september", "october", "november", "december"
    ];

    // 更新收據抬頭為對應月份英文 (例如 9 月顯示 september)
    function updateShopMonth(date) {
      if (!date || !(date instanceof Date) || isNaN(date.getTime())) return;
      const shopName = document.querySelector(".shop-name");
      if (shopName) {
        shopName.textContent = monthNames[date.getMonth()];
      }
    }

    // 更新當前日期與時間
    function updateCurrentDateTime() {
      const now = new Date();

      // 連動更新收據抬頭的月份英文
      updateShopMonth(now);

      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const yyyy = now.getFullYear();

      if (datePickerInstance) {
        datePickerInstance.setDate(now, true, "m/d/Y");
      } else {
        const dateInput = document.getElementById("receiptDate");
        if (dateInput) {
          dateInput.value = `${mm}/${dd}/${yyyy}`;
        }
      }

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strHours = String(hours).padStart(2, '0');

      document.getElementById("receiptTime").textContent = `${strHours}:${minutes}:${seconds} ${ampm}`;
    }

    // 匯出收據圖片 (PNG)
    async function exportReceiptImage() {
      const receipt = document.getElementById("receipt");
      const delButtons = document.querySelectorAll(".btn-delete, .add-row-zone");

      // 截圖前暫時隱藏輔助操作按鈕
      delButtons.forEach(el => el.style.visibility = "hidden");

      try {
        const canvas = await html2canvas(receipt, {
          backgroundColor: null,
          scale: 2 // 高清晰度匯出
        });

        const link = document.createElement("a");
        link.download = `Receipt_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) {
        alert("Image export failed. Please use your browser's print or screenshot feature.");
      } finally {
        delButtons.forEach(el => el.style.visibility = "visible");
      }
    }

    // 啟動初始化
    window.addEventListener("DOMContentLoaded", () => {
      // 讀取上次儲存的品項與實收金額 (若無則使用預設值)
      loadFromStorage();

      // 初始化 Flatpickr 淺粉色選單套件
      if (typeof flatpickr !== "undefined") {
        datePickerInstance = flatpickr("#receiptDate", {
          dateFormat: "m/d/Y",
          defaultDate: new Date(),
          disableMobile: true,
          animate: true,
          monthSelectorType: "static",
          onChange: function (selectedDates) {
            if (selectedDates && selectedDates.length > 0) {
              updateShopMonth(selectedDates[0]);
            }
          }
        });
      }

      updateCurrentDateTime();
      renderItems();
    });
  </script>
</body>

</html>
